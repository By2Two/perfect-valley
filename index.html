<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfect Valley</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' font-size='80' text-anchor='middle' dominant-baseline='central'>⭐</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body data-season="spring">
    <div id="sky" aria-hidden="true">
      <div class="stardrops"></div>
      <div class="celestial sun"></div>
      <div class="celestial moon"></div>
      <div class="clouds far"></div>
      <div class="clouds near"></div>
    </div>
    <canvas id="scene" aria-label="Your farm. Click a building to open its category; drag to move, scroll to zoom."></canvas>
    <div id="hud"></div>
    <div id="controls" class="controls"></div>
    <aside id="panel" hidden aria-live="polite"></aside>
    <nav id="bar"></nav>
    <div id="hint" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal" hidden></div>
    <input type="file" id="file" accept="application/json" hidden />
    <input type="file" id="farm-file" hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
