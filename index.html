<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Vale Perfeito</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⭐</text></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=VT323&display=swap" rel="stylesheet" />
  </head>
  <body data-estacao="spring">
    <div id="ceu" aria-hidden="true">
      <div class="estrelas"></div>
      <div class="astro sol"></div>
      <div class="astro lua"></div>
      <div class="nuvens longe"></div>
      <div class="nuvens perto"></div>
    </div>
    <canvas id="cena" aria-label="Your farm. Click a building to open its category; drag to move, scroll to zoom."></canvas>
    <div id="hud"></div>
    <div id="controles" class="controles"></div>
    <aside id="painel" hidden aria-live="polite"></aside>
    <nav id="barra"></nav>
    <div id="dica" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="modal" hidden></div>
    <input type="file" id="arquivo" accept="application/json" hidden />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
